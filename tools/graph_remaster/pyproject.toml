[project]
name = "graph-remaster"
version = "0.1.0"
description = "Ultima VII Graph Remaster pipeline"
requires-python = ">=3.12"
dependencies = ["Pillow>=10.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
graph-remaster = "graph_remaster.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
