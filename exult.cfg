<config>
  <disk>
    <save_compression_level>1</save_compression_level>
    <game>
      <blackgate>
        <path>D:\Game\Ultima7_VO_1.1\Ultima_7</path>
        <patch>D:\Game\Ultima7_VO_1.1\Ultima_7\patch</patch>
        <keys>D:\Game\Ultima7_VO_1.1\Ultima_7\patch\defaultkeys.txt</keys>
        <waves>sqsfxbg.flx</waves>
        <autonotes>(default)</autonotes>
        <codepage>UTF8</codepage>
      </blackgate>
      <serpentisle>
        <path>..\Ultima_7_SI</path>
        <patch>..\Ultima_7_SI\patch</patch>
        <keys>(default)</keys>
        <waves>sqsfxsi.flx</waves>
        <autonotes>(default)</autonotes>
        <codepage>UTF8</codepage>
      </serpentisle>
    </game>
    <no_crc>yes</no_crc>
  </disk>
  <audio>
    <enabled>yes</enabled>
    <effects>
      <enabled>yes</enabled>
      <convert>gs</convert>
      <sfx_volume>100</sfx_volume>
    </effects>
    <midi>
      <enabled>yes</enabled>
      <convert>gm</convert>
      <reverb>
        <enabled>no</enabled>
        <level>0</level>
        <enabled_FMOpl>no</enabled_FMOpl>
        <level_FMOpl>0</level_FMOpl>
      </reverb>
      <chorus>
        <enabled>no</enabled>
        <level>0</level>
        <enabled_FMOpl>no</enabled_FMOpl>
        <level_FMOpl>0</level_FMOpl>
      </chorus>
      <volume_curve>1.0000</volume_curve>
      <use_oggs>yes</use_oggs>
      <driver>default</driver>
      <volume_FMOpl>100</volume_FMOpl>
      <volume_ogg>100</volume_ogg>
      <looping>auto</looping>
    </midi>
    <speech>
      <enabled>yes</enabled>
      <speech_volume>100</speech_volume>
      <with_subs>yes</with_subs>
      <voice>
        <enabled>yes</enabled>
        <language>en</language>
      </voice>
    </speech>
    <disablepause>no</disablepause>
    <sample_rate>44100</sample_rate>
    <stereo>yes</stereo>
    <text>
      <language>dual</language>
    </text>
    <voice>
      <language>zh</language>
    </voice>
  </audio>
  <gameplay>
    <cheat>yes</cheat>
    <skip_intro>no</skip_intro>
    <skip_splash>no</skip_splash>
    <right_click_closes_gumps>yes</right_click_closes_gumps>
    <gumps_dont_pause_game>no</gumps_dont_pause_game>
    <mouse3rd>no</mouse3rd>
    <fastmouse>no</fastmouse>
    <double_click_closes_gumps>no</double_click_closes_gumps>
    <combat>
      <difficulty>0</difficulty>
      <charmDifficulty>normal</charmDifficulty>
      <mode>keypause</mode>
      <show_hits>no</show_hits>
    </combat>
    <step_tile_delta>8</step_tile_delta>
    <allow_right_pathfind>double</allow_right_pathfind>
    <formation>yes</formation>
    <smooth_scrolling>0</smooth_scrolling>
    <alternate_drop>no</alternate_drop>
    <allow_autonotes>yes</allow_autonotes>
    <scroll_with_mouse>yes</scroll_with_mouse>
    <extended_intro>yes</extended_intro>
    <bg_paperdolls>yes</bg_paperdolls>
    <modal_gump_dragging>Offscreen</modal_gump_dragging>
    <enhancements>yes</enhancements>
    <facestats>0</facestats>
    <textbackground>-1</textbackground>
    <language>
    </language>
    <fonts>serif</fonts>
    <feeding>disabled</feeding>
  </gameplay>
  <video>
    <scale>4</scale>
    <scale_method>Hq4x</scale_method>
    <fullscreen>yes</fullscreen>
    <disable_fades>no</disable_fades>
    <gamma>
      <red>1.0000</red>
      <green>1.0000</green>
      <blue>1.0000</blue>
    </gamma>
    <game>
      <border>
        <red>0</red>
        <green>0</green>
        <blue>0</blue>
      </border>
      <width>0</width>
      <height>0</height>
    </game>
    <display>
      <width>2560</width>
      <height>1440</height>
    </display>
    <fill_mode>Centre</fill_mode>
    <fill_scaler>SDLScaler</fill_scaler>
    <highdpi>yes</highdpi>
    <share_video_settings>yes</share_video_settings>
    <fps>6</fps>
    <chinese>
      <!-- 中文字型檔路徑設定-->
      
      <font_path>data\jf-openhuninn-2.1.ttf</font_path>
      <small_font_path>data\jf-openhuninn-2.1.ttf</small_font_path>
      <sign_font_path>data\WangHanZongWeiBeiTiFan-2.ttf</sign_font_path>
      <!-- 基線、行距、強制TTF渲染設定-->
      
      <baseline_adjust>0</baseline_adjust>
      <line_spacing>4</line_spacing>
      <post_scale_rendering>yes</post_scale_rendering>
      <force_ttf_for_english>yes</force_ttf_for_english>
      <!-- 對話、頭頂、物件名稱文字 渲染設定-->
      
      <font_size_dialog>11</font_size_dialog>
      <font_size_bark>11</font_size_bark>
      <font_color_dialog>-1</font_color_dialog>
      <font_color_bark>-1</font_color_bark>
      <letter_spacing>0</letter_spacing>
      <font_weight>0</font_weight>
      <shadow_type>2</shadow_type>
      <shadow_offset_x>1</shadow_offset_x>
      <shadow_offset_y>1</shadow_offset_y>
      <shadow_color>-1</shadow_color>
      <!-- 書本/雜誌 文字渲染設定 -->
      
      <font_size_book>9</font_size_book>
      <font_color_book>-1</font_color_book>
      <letter_spacing_book>0</letter_spacing_book>
      <font_weight_book>0</font_weight_book>
      <shadow_type_book>0</shadow_type_book>
      <shadow_offset_x_book>1</shadow_offset_x_book>
      <shadow_offset_y_book>1</shadow_offset_y_book>
      <shadow_color_book>-1</shadow_color_book>
      <!-- 黑月之門片頭文字 渲染設定-->
      
      <font_size_intro>15</font_size_intro>
      <font_color_intro>4</font_color_intro>
      <hires_brightness_boost_intro>180</hires_brightness_boost_intro>
      <shadow_color_intro>207</shadow_color_intro>
      <shadow_type_intro>2</shadow_type_intro>
      <shadow_offset_x_intro>1</shadow_offset_x_intro>
      <shadow_offset_y_intro>1</shadow_offset_y_intro>
      <!-- 黑月之門片尾文字 渲染設定-->
      
      <font_size_ending>14</font_size_ending>
      <font_color_ending>254</font_color_ending>
      <hires_brightness_boost_ending>100</hires_brightness_boost_ending>
      <shadow_color_ending>100</shadow_color_ending>
      <shadow_type_ending>2</shadow_type_ending>
      <shadow_offset_x_ending>1</shadow_offset_x_ending>
      <shadow_offset_y_ending>1</shadow_offset_y_ending>
      <!-- 巨蛇之島片頭文字 渲染設定 -->
      
      <font_size_si_intro>15</font_size_si_intro>
      <font_color_si_intro>143</font_color_si_intro>
      <shadow_color_si_intro>27</shadow_color_si_intro>
      <shadow_type_si_intro>2</shadow_type_si_intro>
      <shadow_offset_x_si_intro>1</shadow_offset_x_si_intro>
      <shadow_offset_y_si_intro>1</shadow_offset_y_si_intro>
      <hires_brightness_boost_si_intro>400</hires_brightness_boost_si_intro>
      <!-- 巨蛇之島片尾文字 渲染設定 -->
      
      <font_size_si_ending>15</font_size_si_ending>
      <font_color_si_ending>255</font_color_si_ending>
      <shadow_color_si_ending>207</shadow_color_si_ending>
      <shadow_type_si_ending>2</shadow_type_si_ending>
      <shadow_offset_x_si_ending>1</shadow_offset_x_si_ending>
      <shadow_offset_y_si_ending>1</shadow_offset_y_si_ending>
      <hires_brightness_boost_si_ending>130</hires_brightness_boost_si_ending>
      <!-- 木牌文字 渲染設定-->
      
      <font_size_woodsign>32</font_size_woodsign>
      <font_color_woodsign>-1</font_color_woodsign>
      <font_weight_woodsign>0</font_weight_woodsign>
      <shadow_type_woodsign>1</shadow_type_woodsign>
      <shadow_offset_x_woodsign>-1</shadow_offset_x_woodsign>
      <shadow_offset_y_woodsign>-1</shadow_offset_y_woodsign>
      <shadow_color_woodsign>142</shadow_color_woodsign>
      <!-- 金屬牌文字 渲染設定-->
      
      <font_size_goldsign>32</font_size_goldsign>
      <font_weight_goldsign>0</font_weight_goldsign>
      <font_color_goldsign>-1</font_color_goldsign>
      <shadow_type_goldsign>1</shadow_type_goldsign>
      <shadow_offset_x_goldsign>-1</shadow_offset_x_goldsign>
      <shadow_offset_y_goldsign>-1</shadow_offset_y_goldsign>
      <shadow_color_goldsign>14</shadow_color_goldsign>
      <!-- 墓碑文字 渲染設定-->
      
      <font_size_tombstone>32</font_size_tombstone>
      <font_color_tombstone>-1</font_color_tombstone>
      <letter_spacing_tombstone>0</letter_spacing_tombstone>
      <font_weight_tombstone>0</font_weight_tombstone>
      <shadow_type_tombstone>1</shadow_type_tombstone>
      <shadow_offset_x_tombstone>1</shadow_offset_x_tombstone>
      <shadow_offset_y_tombstone>1</shadow_offset_y_tombstone>
      <shadow_color_tombstone>-1</shadow_color_tombstone>
      <font_size_sign>32</font_size_sign>
      <letter_spacing_sign>0</letter_spacing_sign>
      <letter_spacing_woodsign>0</letter_spacing_woodsign>
      <letter_spacing_goldsign>0</letter_spacing_goldsign>
      <book_font_path>data\jf-openhuninn-2.1.ttf</book_font_path>
    </chinese>
    <!-- 關閉 UI 放大 (強制使用原始 1x 大小) -->
    
    <scale_ui>yes</scale_ui>
    <scale_inventory_mult>1</scale_inventory_mult>
  </video>
  <touch>
    <item_menu>no</item_menu>
    <dpad_location>no</dpad_location>
    <touch_pathfind>no</touch_pathfind>
  </touch>
  <shortcutbar>
    <use_shortcutbar>no</use_shortcutbar>
    <use_outline_color>black</use_outline_color>
    <hide_missing_items>yes</hide_missing_items>
  </shortcutbar>
  <estudio>
    <default_game>blackgate</default_game>
    <image_editor>gimp</image_editor>
    <edit_filetype>.PNG</edit_filetype>
    <main>
      <width>1752</width>
      <height>1308</height>
    </main>
    <shape_scale>2</shape_scale>
    <shape_bilinear>0</shape_bilinear>
  </estudio>
</config>
